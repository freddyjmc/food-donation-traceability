[project]
name = "food-donation-traceability"
version = "0.1.0"
description = "Local app that turns scanned delivery notes into an auditable food-donation traceability register (OCR + SQLite + PDF reports)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "ocr: pruebas con Tesseract (lentas, se ejecutan aparte: pytest -m ocr)",
]
addopts = "-m 'not ocr'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
